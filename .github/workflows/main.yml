name: YouTube Live Scraper

on:
  schedule:
    - cron: '0 */1 * * *' # 每 1 小時執行一次
  workflow_dispatch:      # 支援手動點擊執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # 已移除 cache: 'pip' 以避免找不到 requirements.txt 的錯誤

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Scraper Script
        run: python fetch_lives.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add live_list.txt
          
          # 檢查是否有內容變動才進行 Commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto update: $(date +'%Y-%m-%d %H:%M') [UTC]"
            git push
          else
            echo "沒有偵測到變動，跳過 Commit。"
          fi
